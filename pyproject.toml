[project]
name = "ssh-mcp-server"
version = "0.1.0"
description = "SSH MCP Server - Model Context Protocol server for SSH remote system management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "zlzero", email = "zhouxiangjingzlz@163.com"}
]
keywords = ["ssh", "mcp", "model-context-protocol", "ai", "llm", "linux", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.9.4",
    "paramiko>=3.5.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ssh-mcp-server = "src.main:cli"

[project.urls]
Homepage = "https://github.com/zhouxiangjing/mcp-ssh"
Repository = "https://github.com/zhouxiangjing/mcp-ssh"

[build-system]
requires = ["uv_build>=0.8.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = "."

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
